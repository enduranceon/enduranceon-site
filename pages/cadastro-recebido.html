<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Endurance On | Cadastro recebido</title>
  <link rel="stylesheet" href="../css/styles.min.css">
  <link rel="stylesheet" href="../css/responsive.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #f6f7f8; }
    .success-wrap { min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; }
    .success-card { max-width: 620px; background: #fff; border-radius: 18px; padding: 42px 32px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.1); }
    .success-icon { width: 72px; height: 72px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; background: #e9f8ef; color: #178447; font-size: 32px; }
    .success-card h1 { margin-bottom: 12px; color: #17212b; }
    .success-card p { color: #52606d; line-height: 1.65; }
    .success-actions { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .success-actions a { padding: 12px 20px; border-radius: 9px; text-decoration: none; font-weight: 700; }
    .home-link { background: #ff8012; color: #fff; }
    .whatsapp-link { border: 1px solid #1f9d55; color: #178447; }
  </style>
</head>
<body>
  <main class="success-wrap">
    <section class="success-card">
      <div class="success-icon"><i class="fas fa-check"></i></div>
      <h1>Cadastro recebido!</h1>
      <p>Sua pré-matrícula já chegou para a equipe da Endurance On. Vamos conferir os dados e entrar em contato pelo WhatsApp para confirmar o início e orientar os próximos passos.</p>
      <div class="success-actions">
        <a class="home-link" href="../index.html">Voltar ao site</a>
        <a class="whatsapp-link" href="https://wa.me/5548991178688" target="_blank" rel="noopener noreferrer">Falar no WhatsApp</a>
      </div>
    </section>
  </main>
</body>
</html>
