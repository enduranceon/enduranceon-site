# Redirecionamentos do site (troca de 29/10/2026).
# URLs novas e curtas (/calendario, /treinos-coletivos, /parceiros, /contato, /treinador-<nome>);
# as antigas redirecionam para elas com 301 (force = true: vale mesmo que o arquivo antigo ainda exista).
# O redirecionamento antigo guto-fernandes-bio agora aponta direto para a página nova, sem cadeia.
# Âncoras antigas da home (/#contato, /#sobre, /#faq) não passam pelo servidor.

# ---- Regras que já existem no netlify.toml oficial, apontadas direto para a página nova
# (evita um redirecionamento em cadeia: bio -> guto-fernandes.html -> /treinador-guto-fernandes).
[[redirects]]
from = "/pages/treinadores/guto-fernandes-bio.html"
to = "/treinador-guto-fernandes"
status = 301
force = true

[[redirects]]
from = "/pages/treinadores/guto-fernandes-bio"
to = "/treinador-guto-fernandes"
status = 301
force = true

